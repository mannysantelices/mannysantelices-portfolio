<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.emailjs.com; base-uri 'self'; form-action 'self'">
  <!-- Applies the saved theme before first paint, so a reload never shows the wrong theme. -->
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
  <!-- Fallback only: every route sets its own title (core/seo). -->
  <title>Websites and DevSecOps on AWS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#a41c44" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="favicon-light.png">
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="favicon-dark.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
