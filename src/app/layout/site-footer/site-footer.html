<footer class="site-footer">
  <div class="footer-brand">
    <p class="footer-line">
      <img class="footer-mark" src="assets/img/mark.svg" alt="" width="22" height="24" />{{ footerLine }}</p>
  </div>
  <nav class="footer-nav" aria-label="Footer">
    <div class="footer-group">
      <p class="footer-heading">Services</p>
      <ul>
        @for (link of serviceLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="exactMatch"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </div>
    <div class="footer-group">
      <p class="footer-heading">Company</p>
      <ul>
        @for (link of companyLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="exactMatch"
              >{{ link.label }}</a
            >
          </li>
        }
        <li>
          <a [attr.href]="labLink.href">{{ labLink.label }}</a>
        </li>
        <li>
          <a [routerLink]="currentPath()" [fragment]="contactFragment">{{ contactLabel }}</a>
        </li>
      </ul>
    </div>
  </nav>
  <p class="footer-legal">&copy; {{ year }} {{ businessName }}</p>
</footer>
