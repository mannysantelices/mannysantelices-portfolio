<ul class="practice-grid cols-3 tier-grid reveal" role="list">
  @for (tier of tiers; track tier.name) {
    <li class="tier-card">
      <h3>{{ tier.name }}</h3>
      <p class="tier-summary">{{ tier.summary }}</p>
      <ul class="check-list tier-scope" role="list">
        @for (item of tier.scope; track item) {
          <li>
            <svg aria-hidden="true" focusable="false"><use href="#icon-check"></use></svg>
            <span>{{ item }}</span>
          </li>
        }
      </ul>
      <p class="tier-time">{{ tier.time }}</p>
      <a class="text-link" [routerLink]="currentPath()" [fragment]="contactFragment">{{
        tier.linkLabel
      }}</a>
    </li>
  }
</ul>

<p class="small tier-footnote reveal">{{ footnote }}</p>

<div class="tier-note reveal">
  <div>
    <h3>{{ between.title }}</h3>
    <p>{{ between.body }}</p>
  </div>
  <a class="text-link" [routerLink]="currentPath()" [fragment]="contactFragment">{{
    between.linkLabel
  }}</a>
</div>
