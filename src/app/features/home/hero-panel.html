<div class="hero-panel" role="img" [attr.aria-label]="panel.label">
  <p class="panel-pill" aria-hidden="true">{{ panel.pill }}</p>
  <ol class="panel-steps" aria-hidden="true">
    @for (step of panel.steps; track step.name; let index = $index) {
      <li class="panel-step" [class.is-highlight]="step.highlight">
        <span class="panel-num">{{ index + 1 }}</span>
        <span class="panel-text">
          <span class="panel-name">{{ step.name }}</span>
          <span class="panel-detail">{{ step.detail }}</span>
        </span>
      </li>
    }
  </ol>
</div>
