<app-page-hero [copy]="hero" />

<app-page-section [copy]="servicesSection">
  <app-service-cards />
</app-page-section>

<app-page-section [copy]="startSection">
  <app-offer-cards [snapshots]="snapshots" [linkTitles]="true" />
</app-page-section>

<app-page-section [copy]="howSection">
  <app-card-grid [cards]="howCards" [columns]="3" />
  <p class="section-after reveal">
    <a class="text-link" [routerLink]="aboutPath" [fragment]="remoteFragment">{{ remoteLink }}</a>
  </p>
</app-page-section>

<app-page-section [copy]="workSection">
  <app-case-card />
</app-page-section>

<app-page-section [copy]="aboutSection">
  <div class="prose reveal">
    <p>{{ about.body }}</p>
    <p>
      <a class="text-link" [routerLink]="aboutPath">{{ about.linkLabel }}</a>
    </p>
  </div>
</app-page-section>
